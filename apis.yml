apis:
- name: Delhivery Express Last-Mile API
  description: >-
    Last-mile express parcel API covering pincode serviceability, bulk and single
    waybill generation, order creation/manifestation, shipment tracking, order edit
    and cancel, shipping-charge invoicing, packing-slip generation, pickup requests,
    client-warehouse creation/edit, and asynchronous NDR package actions. Authenticated
    with a client API token passed in the request headers. JSON request/response.
  humanURL: https://delhivery-express-api-doc.readme.io/reference/introduction-1
  baseURL: https://track.delhivery.com
