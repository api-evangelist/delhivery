- name: Delhivery One B2C Shipping API
  description: >-
    Self-service B2C shipping APIs exposed through the Delhivery One developer portal:
    pincode serviceability, fetch waybill, client warehouse creation/updation, package
    shipment creation/updation, shipment tracking, shipping-cost calculation, shipping-label
    generation, pickup request creation and NDR shipment updation. Includes a staging
    test environment and a self-service execute/test console behind login.
  humanURL: https://one.delhivery.com/developer-portal/documents
  baseURL: https://ucp-app-gateway.delhivery.com/open/
