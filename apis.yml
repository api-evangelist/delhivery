aid: delhivery
name: Delhivery
description: >-
  Delhivery is India's largest integrated third-party logistics (3PL) service provider,
  offering express parcel delivery, part-truckload and full-truckload freight, warehousing,
  supply-chain services, cross-border logistics and shipment tracking. Its developer
  platform exposes REST APIs for pincode serviceability, waybill generation, order
  creation and manifestation, shipment tracking (pull and webhook push), shipping-cost
  invoicing, packing-slip and shipping-label generation, pickup requests, client-warehouse
  management and NDR (non-delivery report) actions. APIs are consumed with a client
  API token and are documented across the Delhivery One developer portal, the Express
  Last-Mile API reference (ReadMe) and the OS1 platform docs.
